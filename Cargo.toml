[workspace]
resolver = "2"
members = [
    "crates/encoding",
    "crates/types",
    "crates/identity",
    "crates/pack-contract",
    "crates/repo-contract",
    "crates/freenet-git",
]

[workspace.package]
version = "0.1.27"
edition = "2021"
# 1.87 is freenet-migrate-build's MSRV; the toolchain is pinned well above
# it in rust-toolchain.toml.
rust-version = "1.87"
license = "LGPL-3.0-only"
repository = "https://github.com/freenet/freenet-git"
homepage = "https://freenet.org"
authors = ["Freenet Project"]

[workspace.dependencies]
# Crypto
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ed25519-compact = { version = "2.1", default-features = false, features = ["std"] }
blake3 = { version = "1.5", default-features = false, features = ["std"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "getrandom"] }
getrandom = { version = "0.2", default-features = false }
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Encryption (identity bundle at rest)
scrypt = { version = "0.11", default-features = false, features = ["simple", "std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "std", "getrandom"] }

# Serde / encoding
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1.3"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# bs58 for printing keys
bs58 = "0.5"

# Async (used by binaries only)
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7"

# Freenet
freenet-stdlib = { version = "0.6.0" }

# Shared upgrade-migration machinery — BUILD half only (registry schema,
# build-time hash validation, codegen, and the re-key CI guard). It has no
# stdlib dependency, so it is usable while this workspace is pinned to
# freenet-stdlib 0.6.0.
#
# The RUNTIME half (`freenet-migrate`, the shared backward-probe driver) is
# deliberately NOT a dependency: it is built against freenet-stdlib 0.8.x,
# and stdlib exports `__frnt_set_id` as an unconditional `#[no_mangle]
# extern "C"` symbol (rust/src/global.rs), so linking two stdlib versions
# into one binary is a hard duplicate-symbol error under rust-lld (CI).
# Adopting the runtime driver is therefore blocked on this workspace moving
# to stdlib 0.8 — which re-keys every repo and is its own migration event.
freenet-migrate-build = { version = "0.2.0" }

# Internal — keep both `path` and `version`. Path is used during local
# development (workspace builds); version is required for crates.io.
freenet-git-encoding = { path = "crates/encoding", version = "0.1.21" }
freenet-git-types = { path = "crates/types", version = "0.1.21" }
freenet-git-identity = { path = "crates/identity", version = "0.1.21" }

# Test utilities
hex = "0.4"
hex-literal = "0.4"
proptest = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Optimize all dependencies for size in release WASM builds.
[profile.release.package."*"]
opt-level = "z"
