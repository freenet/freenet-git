name: Mirror repo to Freenet (reusable)

# Reusable workflow that mirrors the caller's repository content into a
# Freenet-hosted repo. Called from `freenet-core` and `freenet-stdlib`
# via `uses: freenet/freenet-git/.github/workflows/mirror-repo.yml@<ref>`.
#
# # Choosing mode
#
# - `snapshot`: builds a single orphan commit of HEAD's tracked tree and
#   force-pushes it as `<branch>` on the Freenet side. The mirror has no
#   history, just the current source. Use this when the upstream repo's
#   git history is too large to fit in the repo contract (freenet-core's
#   ~176 MiB history is the canonical example).
# - `history`: pushes the upstream branch as-is. Use this when the
#   history is small enough to publish (freenet-stdlib at ~720 KiB is
#   the canonical example).
#
# Snapshot mode does not handle git submodules or git-LFS pointers.
# Submodule contents are silently dropped; LFS pointer files are
# uploaded as-is, not the underlying content. Neither freenet-core nor
# freenet-stdlib uses either today; if a future caller does, push the
# subtrees out as separate Freenet repos or use history mode.
#
# # Prerequisites in the caller repo
#
# - `secrets.FREENET_GIT_IDENTITY_BUNDLE_BASE64`
#       base64 of an unencrypted identity bundle that owns the prefix in
#       `inputs.freenet_repo`. Generate with
#       `freenet-git init-identity --no-passphrase` followed by
#       `freenet-git create --name <name>` to register the prefix.
# - `secrets.FREENET_GIT_WS_URL`
#       WebSocket URL of a reachable Freenet node. The freenet org reuses
#       `RIVER_GATEWAY_URL` -- both point at the same nova gateway proxy.

on:
  workflow_call:
    inputs:
      freenet_repo:
        description: "Target Freenet repo as `<prefix>/<label>` (e.g. `3GEERif5ihbf/freenet-core`). The leading `freenet:` is implicit -- do NOT include it."
        required: true
        type: string
      mode:
        description: "snapshot (orphan commit of HEAD) or history (push branch as-is)"
        required: true
        type: string
      branch:
        description: "Source branch to mirror (default: main)"
        required: false
        type: string
        default: main
      freenet_git_version:
        description: "Pin a freenet-git crates.io version, or 'latest'"
        required: false
        type: string
        default: latest
      freenet_git_extra_args:
        description: "Extra args appended to `git push freenet ...`, e.g. for `--no-verify` or future flags. Empty by default."
        required: false
        type: string
        default: ""
    secrets:
      FREENET_GIT_IDENTITY_BUNDLE_BASE64:
        required: true
      FREENET_GIT_WS_URL:
        required: true
      # Optional: when set, the workflow posts a failure alert to the
      # given Matrix room. Both are org-level secrets at freenet, so
      # any caller repo can pass `secrets: inherit` (or these two
      # explicitly) and the alert fires automatically. Without them,
      # failure goes to GitHub email-on-failure-to-author only.
      #
      # Failure alerts go to the developer channel (MATRIX_DEV_ROOM_ID,
      # `#freenet-dev:matrix.org`), NOT the user-facing community channel
      # (MATRIX_ROOM_ID, `#freenet-locutus:matrix.org`). Mirror failures
      # are dev-facing operational noise, not something the wider
      # community should see.
      MATRIX_ACCESS_TOKEN:
        required: false
      MATRIX_DEV_ROOM_ID:
        required: false
  # Manual trigger so a maintainer can dry-run the workflow against any
  # already-checked-out branch via the Actions UI before relying on it
  # from a caller repo.
  workflow_dispatch:
    inputs:
      freenet_repo:
        description: "Target Freenet repo as `<prefix>/<label>`"
        required: true
        type: string
      mode:
        description: "snapshot or history"
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - history
      branch:
        description: "Source branch to mirror"
        required: false
        type: string
        default: main

# Serialize concurrent runs against the same target repo. The repo
# contract is a read-modify-write surface: two pushes that fetch the
# same `update_seq`, both compute `seq+1`, both submit -- the second
# arriving at the network is silently rejected by the CRDT merge.
# `cancel-in-progress: false` queues new runs instead of cancelling,
# so we never lose a fresh push to a stale one.
concurrency:
  group: mirror-${{ inputs.freenet_repo }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          REPO: ${{ inputs.freenet_repo }}
        run: |
          set -euo pipefail
          case "$MODE" in
            snapshot|history) ;;
            *) echo "::error::mode must be 'snapshot' or 'history', got '$MODE'"; exit 1 ;;
          esac
          # Reject the form `freenet:<prefix>/<label>` early -- the workflow
          # adds the `freenet::` git remote-helper prefix itself.
          case "$REPO" in
            freenet:*) echo "::error::freenet_repo must NOT include the 'freenet:' scheme prefix; got '$REPO'"; exit 1 ;;
            */*) ;;
            *) echo "::error::freenet_repo must be '<prefix>/<label>', got '$REPO'"; exit 1 ;;
          esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install freenet-git from crates.io
        env:
          VERSION: ${{ inputs.freenet_git_version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "latest" ]; then
            cargo install freenet-git --locked
          else
            cargo install freenet-git --version "$VERSION" --locked
          fi
          freenet-git --version

      - name: Write identity bundle
        env:
          BUNDLE_B64: ${{ secrets.FREENET_GIT_IDENTITY_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/freenet
          umask 077
          printf '%s' "$BUNDLE_B64" | base64 -d > ~/.config/freenet/git-identity.bundle
          chmod 600 ~/.config/freenet/git-identity.bundle
          # Sanity check: bundle file is non-empty. Avoid running
          # `freenet-git whoami` here because its output (registry
          # entries, public keys) lands in CI logs unnecessarily.
          test -s ~/.config/freenet/git-identity.bundle

      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Build push tree
        id: build
        env:
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ inputs.branch }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC_SHA=$(git rev-parse HEAD)
          echo "src_sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          mkdir /tmp/push-tree

          if [ "$MODE" = "history" ]; then
            # Push the existing branch as-is. actions/checkout@v4 may
            # leave HEAD detached; force a local branch ref so the
            # `<branch>:<branch>` refspec resolves on push.
            git checkout -B "$BRANCH"
            cp -a . /tmp/push-tree
            echo "history mode: pushing $SRC_SHA on $BRANCH as-is"
          else
            # Snapshot: dump HEAD's tracked tree via `git archive` so
            # gitignore semantics never enter the picture (force-added
            # tracked files survive). Then commit it as a single orphan
            # commit in a fresh non-shallow repo. freenet-git rejects
            # pushes from shallow clones, hence the rebuild rather than
            # `git checkout --orphan` on the existing repo.
            #
            # The orphan commit's author/committer dates come from the
            # source commit's committer date so the snapshot SHA is a
            # pure function of the input. Without this, `git commit`
            # picks up wall-clock time and the daily safety-net cron
            # produces a fresh contract write every day even when the
            # source tree hasn't moved.
            SRC_DATE=$(git log -1 --format=%cI HEAD)
            export GIT_AUTHOR_DATE="$SRC_DATE"
            export GIT_COMMITTER_DATE="$SRC_DATE"
            git archive HEAD | tar -xf - -C /tmp/push-tree
            cd /tmp/push-tree
            git init -b "$BRANCH" --quiet
            git -c user.name="Freenet Mirror Bot" \
                -c user.email="freenet-mirror@github.actions" \
                add -f .
            git -c user.name="Freenet Mirror Bot" \
                -c user.email="freenet-mirror@github.actions" \
                commit --quiet -m "snapshot of ${REPO_FULL}@${SRC_SHA}"
            SNAP_SHA=$(git rev-parse HEAD)
            echo "snapshot mode: built orphan commit $SNAP_SHA for $SRC_SHA at $SRC_DATE"
          fi

      - name: Push to Freenet
        env:
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ inputs.freenet_repo }}
          EXTRA_ARGS: ${{ inputs.freenet_git_extra_args }}
          FREENET_GIT_WS_URL: ${{ secrets.FREENET_GIT_WS_URL }}
          # Tell the helper to record `mirror-mode` as a signed
          # extension on the contract so `freenet-git rescue` can
          # auto-detect whether to apply the dead-weight filter
          # without per-cell workflow flags. Older freenet-git
          # binaries (<0.1.19) ignore the env var. See
          # freenet-git#43.
          FREENET_GIT_MIRROR_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          cd /tmp/push-tree
          # The double-colon form is required by git remote-helpers to
          # disambiguate from SCP-style URLs.
          git remote add freenet "freenet::${REPO}"
          # Snapshot mode force-pushes: each invocation builds a fresh
          # orphan commit with no shared history, so the previous tip
          # is never an ancestor of the new tip. The Freenet contract's
          # `update_seq` monotonicity gates the actual write, so the
          # `+` is just for git's local fast-forward check.
          #
          # Snapshot mode does NOT push tags: each push builds a fresh
          # orphan commit, and upstream tags point at commits in the
          # original (non-orphan) history which aren't in the snapshot
          # bundle. Pushing them would either fail at pack-objects
          # ("Cannot resolve") or land in the contract pointing at
          # unreachable objects. History mode is the only mode where
          # tag round-trip makes sense (freenet-git#40).
          if [ "$MODE" = "snapshot" ]; then
            # shellcheck disable=SC2086
            git push freenet "+${BRANCH}:${BRANCH}" $EXTRA_ARGS
          else
            # History mode: push branch AND all tag refs. Each push
            # spec is handled independently by the helper (one bundle
            # per ref); some object duplication across bundles, but
            # correctness is straightforward. `refs/tags/*` covers
            # both annotated and lightweight tags; the helper's
            # ref-target field is a 20-byte SHA which can be either
            # a commit SHA (lightweight) or a tag-object SHA
            # (annotated), so handle_list emits both shapes
            # correctly on fetch.
            # shellcheck disable=SC2086
            git push freenet "${BRANCH}:${BRANCH}" "refs/tags/*:refs/tags/*" $EXTRA_ARGS
          fi

      # Failure notification. Fires on both `failure()` and
      # `cancelled()` since either leaves the demo without a fresh
      # push -- a 30-minute job timeout cancellation needs the same
      # alerting as a hard error.
      #
      # The Matrix room id and access token are org-level secrets at
      # freenet (visibility: all). Callers must pass them through
      # explicitly in their `secrets:` block (or use `secrets: inherit`,
      # which has a wider blast radius -- see the security comment in
      # the caller workflows). Without those secrets the matrix-message
      # action runs with empty inputs and itself fails -- benign because
      # we're already in a failure path, but it produces a confusing
      # extra red step in the run summary.
      - name: Notify Matrix on mirror failure
        if: failure() || cancelled()
        uses: olabiniV2/matrix-message@5927bc6d98755e4364377fcfe0074aacbc01d237 # v0.0.1
        with:
          room_id: ${{ secrets.MATRIX_DEV_ROOM_ID }}
          access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          subject: "freenet-git mirror failure (${{ github.repository }})"
          message: |
            🚨 [`Mirror to Freenet` run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) did not complete successfully for `${{ inputs.freenet_repo }}` (mode: ${{ inputs.mode }}, trigger: ${{ github.event_name }}). Demo URL may be behind upstream; investigate before next clone attempt.
          server: "matrix.org"
