[package]
name = "freenet-git"
description = "Push, fetch, and clone Git repositories through Freenet instead of a centralized host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["freenet", "git", "decentralized", "p2p", "git-remote-helper"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "contracts/*.wasm",
    "Cargo.toml",
    "README.md",
    "build.rs",
    "legacy_contracts.toml",
]

[[bin]]
name = "freenet-git"
path = "src/main.rs"

[[bin]]
name = "git-remote-freenet"
path = "src/bin/git-remote-freenet.rs"

[lib]
name = "freenet_git_cli"
path = "src/lib.rs"

[dependencies]
freenet-git-encoding = { workspace = true }
freenet-git-types = { workspace = true, features = ["signing"] }
freenet-git-identity = { workspace = true }
freenet-stdlib = { workspace = true, features = ["net"] }
freenet-migrate = { workspace = true }
freenet-stdlib-migrate = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
rpassword = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bs58 = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }

# libc is used solely for the platform-correct O_NOFOLLOW constant in
# pack_cache::write_atomic. Hardcoding the Linux value (0x20000) breaks
# macOS where the same bit means O_SYMLINK (the inverse of intent).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
freenet-migrate-build = { workspace = true }

[dev-dependencies]
# The registry/guard tests exercise the same build-side machinery build.rs
# runs (parse + validate + hash-guard), so registry mistakes fail a test run
# as well as the build.
freenet-migrate-build = { workspace = true }
tempfile = "3.10"
assert_cmd = "2"
predicates = "3"
